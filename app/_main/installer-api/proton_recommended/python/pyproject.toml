[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "makai-forge-provision"
version = "0.1.0"
description = "Makai Forge Provision Utils — bridge, game utils, wine tools"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["Utils*", "bridge*"]
