appId: com.makaiforger.app
productName: Makai forger
directories:
  buildResources: build
extraResources:
  - from: app/_resources/binaries/ludusavi
    to: binaries/ludusavi
  - protonforge-python-rpc
  - from: app/_resources/native/protonforge-native.node
    to: protonforge-native/protonforge-native.node
  - seeds
  - from: app/_assets/audio/achievement.wav
  - from: app/_data/releases
  - from: app/_data/sources
  - from: app/_main/bootstrap
  - from: app/_assets/backgrounds
    to: app/_assets/backgrounds
  - from: app/_resources/compact-flow
    to: app/_resources/compact-flow
files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!app/_resources/native/protonforge-native/target"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
asarUnpack:
  - app/_resources/**
  - app/_data/**
  - node_modules/sharp/**
  - node_modules/@img/sharp-libvips-*/**
linux:
  extraResources:
    - from: app/_resources/binaries/7zzs
    - from: app/_resources/binaries/umu-run
    - from: app/_resources/python
      to: app/_resources/python
  target:
    - AppImage
    - snap
    - deb
    - rpm
  maintainer: electronjs.org
  category: Game
  mimeTypes:
    - x-scheme-handler/protonforge
    - application/vnd.microsoft.portable-executable
    - application/x-ms-dos-executable
    - application/x-dosexec
    - application/x-msdownload
    - application/x-msi
  afterInstall: scripts/compactflow-postinst.sh
flatpak:
  runtime: org.freedesktop.Platform
  runtimeVersion: "24.08"
  sdk: org.freedesktop.Sdk
  base: org.electronjs.Electron2.BaseApp
  baseVersion: "24.08"
  finishArgs:
    - --socket=x11
    - --socket=wayland
    - --share=ipc
    - --share=network
    - --socket=pulseaudio
    - --filesystem=host
    - --env=COMPACTFLOW_IN_FLATPAK=1
    - --talk-name=org.freedesktop.Flatpak
snap:
  plugs:
    - desktop
    - desktop-legacy
    - home
    - network
    - opengl
    - wayland
    - x11
    - pulseaudio
    - removable-media
  environment:
    COMPACTFLOW_IN_SNAP: "1"
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: lucasgertke11-bot
  repo: Proton_Forge
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/